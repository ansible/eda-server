openapi: 3.0.3
info:
  title: Event Driven Ansible API
  version: 0.2.0
paths:
  /activation-instances/:
    get:
      operationId: activation_instances_list
      description: List Activation Instances
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: Filter by activation instance name.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by activation instance status.
      tags:
      - activation-instances
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivationInstanceList'
          description: ''
      x-ai-description: List activation instances. Returns status, queue, and start/end
        times. Supports filtering and pagination.
  /activation-instances/{id}/logs/:
    get:
      operationId: activation_instances_logs_list
      description: List Activation instance logs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Activation Instance.
        required: true
      - in: query
        name: log
        schema:
          type: string
        description: Filter by activation instance log.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - activation-instances
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivationInstanceLogList'
          description: ''
      x-ai-description: List logs for an activation instance by ID. Returns log records
        with timestamps and levels. Supports filtering and pagination.
  /activation-instances/{id}/:
    get:
      operationId: activation_instances_retrieve
      description: Get the Activation Instance by its id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this rulebook process.
        required: true
      tags:
      - activation-instances
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationInstance'
          description: ''
      x-ai-description: Retrieve single activation instance
  /activations/:
    get:
      operationId: activations_list
      description: List Activations
      parameters:
      - in: query
        name: decision_environment_id
        schema:
          type: number
        description: Filter by Decision Environment ID.
      - in: query
        name: name
        schema:
          type: string
        description: Filter by activation name.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project_id
        schema:
          type: number
        description: Filter by project id
      - in: query
        name: status
        schema:
          type: string
        description: Filter by activation status.
      tags:
      - activations
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivationListList'
          description: Return a list of Activations.
      x-ai-description: List activations. Returns activation records. Supports filtering
        and pagination.
    post:
      operationId: activations_create
      tags:
      - activations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivationCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRead'
          description: ''
        '400':
          description: Invalid data to create activation.
        '503':
          description: Dependent service issues
      x-ai-description: Create an activation. Returns the created activation.
  /activations/{id}/instances/:
    get:
      operationId: activations_instances_list
      description: List all instances for the Activation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this rulebook.
        required: true
      - in: query
        name: name
        schema:
          type: string
        description: Filter by activation instance name.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by activation instance status.
      tags:
      - activations
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivationInstanceList'
          description: ''
      x-ai-description: List all instances for an activation
  /activations/{id}/:
    get:
      operationId: activations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activation.
        required: true
      tags:
      - activations
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRead'
          description: ''
      x-ai-description: Retrieve single activation
    patch:
      operationId: activations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activation.
        required: true
      tags:
      - activations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivationUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivationUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivationUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRead'
          description: ''
        '400':
          description: Invalid data to update activation.
        '409':
          description: The activation is not allowed to be updated.
      x-ai-description: Update an activation by ID. Returns the updated activation.
    delete:
      operationId: activations_destroy
      description: Delete an existing Activation
      parameters:
      - in: query
        name: force
        schema:
          type: boolean
        description: Force delete after worker node offline
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activation.
        required: true
      tags:
      - activations
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: The Activation has been deleted.
        '409':
          description: Activation blocked while Workers offline.
      x-ai-description: Delete existing activation
  /activations/{id}/copy/:
    post:
      operationId: activations_copy_create
      description: Copy an activation.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activation.
        required: true
      tags:
      - activations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationCopy'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivationCopy'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivationCopy'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRead'
          description: Return the copied activation.
        '404':
          description: Activation not found.
      x-ai-description: Create new copy for an activation
  /activations/{id}/disable/:
    post:
      operationId: activations_disable_create
      description: Disable the Activation
      parameters:
      - in: query
        name: force
        schema:
          type: boolean
        description: Force disable after worker node offline
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activation.
        required: true
      tags:
      - activations
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: Activation has been disabled.
        '409':
          description: Activation blocked while Workers offline.
      x-ai-description: Disable an activation by ID. Stops the rulebook process if
        running.
  /activations/{id}/enable/:
    post:
      operationId: activations_enable_create
      description: Enable the Activation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activation.
        required: true
      tags:
      - activations
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: Activation has been enabled.
        '400':
          description: Activation not enabled.
        '409':
          description: Processing of enable is disallowed.
      x-ai-description: Enable an activation by ID. Starts the rulebook process if
        valid.
  /activations/{id}/restart/:
    post:
      operationId: activations_restart_create
      description: Restart the Activation
      parameters:
      - in: query
        name: force
        schema:
          type: boolean
        description: Force restart after worker node offline
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this activation.
        required: true
      tags:
      - activations
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: Activation restart was successful.
        '400':
          description: Activation not enabled.
        '409':
          description: Activation blocked while Workers offline.
      x-ai-description: Create new restart for an activation
  /audit-rules/:
    get:
      operationId: audit_rules_list
      description: List all fired rules
      parameters:
      - in: query
        name: activation_instance_id
        schema:
          type: string
        description: Filter by activation_instance_id
      - in: query
        name: created_at
        schema:
          type: string
          format: date-time
        description: Filter by created_at
      - in: query
        name: fired_at
        schema:
          type: string
          format: date-time
        description: Filter by fired_at
      - in: query
        name: id
        schema:
          type: number
        description: Filter by id
      - in: query
        name: job_instance_id
        schema:
          type: string
        description: Filter by job_instance_id
      - in: query
        name: name
        schema:
          type: string
        description: Filter by name
      - in: query
        name: organization_id
        schema:
          type: string
        description: Filter by organization_id
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: rule_uuid
        schema:
          type: string
        description: Filter by rule_uuid
      - in: query
        name: ruleset_name
        schema:
          type: string
        description: Filter by ruleset_name
      - in: query
        name: ruleset_uuid
        schema:
          type: string
        description: Filter by ruleset_uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status
      tags:
      - audit-rules
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditRuleListList'
          description: Return a list of fired rules.
      x-ai-description: List fired audit rules. Returns audit rule records. Supports
        filtering and pagination.
  /audit-rules/{id}/actions/:
    get:
      operationId: audit_rules_actions_list
      description: Action list of a fired rule by its id
      parameters:
      - in: query
        name: audit_rule_id
        schema:
          type: string
        description: Filter by audit_rule_id
      - in: query
        name: fired_at
        schema:
          type: string
          format: date-time
        description: Filter by fired_at
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this rule audit.
        required: true
      - in: query
        name: id
        schema:
          type: string
        description: Filter by id
      - in: query
        name: name
        schema:
          type: string
        description: Filter by name
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: rule_fired_at
        schema:
          type: string
          format: date-time
        description: Filter by rule_fired_at
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status
      - in: query
        name: status_message
        schema:
          type: string
        description: Filter by status_message
      - in: query
        name: url
        schema:
          type: string
        description: Filter by url
      tags:
      - audit-rules
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditActionList'
          description: ''
      x-ai-description: List all actions for an audit-rule
  /audit-rules/{id}/events/:
    get:
      operationId: audit_rules_events_list
      description: Event list of a fired rule by its id
      parameters:
      - in: query
        name: audit_actions
        schema:
          type: string
        description: Filter by audit_actions
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Audit Rule.
        required: true
      - in: query
        name: id
        schema:
          type: string
        description: Filter by id
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payload
        schema:
          type: string
        description: Filter by payload
      - in: query
        name: received_at
        schema:
          type: string
          format: date-time
        description: Filter by received_at
      - in: query
        name: rule_fired_at
        schema:
          type: string
          format: date-time
        description: Filter by rule_fired_at
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source_name
        schema:
          type: string
        description: Filter by source_name
      - in: query
        name: source_type
        schema:
          type: string
        description: Filter by source_type
      tags:
      - audit-rules
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
      x-ai-description: List all events for an audit-rule
  /audit-rules/{id}/:
    get:
      operationId: audit_rules_retrieve
      description: Get the fired rule by its id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit rule.
        required: true
      tags:
      - audit-rules
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRuleDetail'
          description: Return the fired rule by its id.
      x-ai-description: Retrieve single audit rule
  /auth/session/login/:
    get:
      operationId: auth_session_preflight
      description: Use this method to set a CSRF cookie.
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: OK
      x-ai-description: Preflight Use this method to set a CSRF cookie
    post:
      operationId: auth_session_login
      description: Session cookie login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '403':
          description: Invalid credentials or user is disabled.
        '204':
          description: Login successful.
      x-ai-description: Login Session cookie login
  /auth/session/logout/:
    post:
      operationId: auth_session_logout
      description: Session logout.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Logout successful.
      x-ai-description: Logout Session logout
  /auth/token/refresh/:
    post:
      operationId: token_refresh
      description: Refresh websocket access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTToken'
          description: ''
      x-ai-description: Refresh Refresh websocket access token
  /config/:
    get:
      operationId: config_retrieve
      description: Get the current configuration info of EDA.
      tags:
      - config
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
          description: Return the current configuration info of EDA.
      x-ai-description: Retrieve single config
  /credential-input-sources/:
    get:
      operationId: credential_input_sources_list
      description: List all Credential Input Sources
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: source_credential
        schema:
          type: integer
        description: Filter by Source Credential ID.
      - in: query
        name: target_credential
        schema:
          type: integer
        description: Filter by Target Credential ID.
      tags:
      - credential-input-sources
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCredentialInputSourceList'
          description: Return a list of Credential Input Sources.
      x-ai-description: List all credential input sources
    post:
      operationId: credential_input_sources_create
      description: Create a new Credential Input Source.
      tags:
      - credential-input-sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInputSourceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialInputSourceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialInputSourceCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInputSource'
          description: Return the new Credential Input Source.
      x-ai-description: Create new credential input source
  /credential-input-sources/{id}/:
    get:
      operationId: credential_input_sources_retrieve
      description: Get CredentialInputSource by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential input source.
        required: true
      - in: query
        name: refs
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Query resources that have reference to the credential input source
          by its id
      tags:
      - credential-input-sources
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInputSource'
          description: Return an Credential Input Source by id.
      x-ai-description: Retrieve single credential input source
    patch:
      operationId: credential_input_sources_partial_update
      description: Partial update of an Credential Input Source
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential input source.
        required: true
      tags:
      - credential-input-sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCredentialInputSourceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCredentialInputSourceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCredentialInputSourceUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInputSource'
          description: Update successful. Return an updated credential input source.
      x-ai-description: Partially update existing credential input source
    delete:
      operationId: credential_input_sources_destroy
      description: |-
        The CredentialInputSourceViewSet is used to link fields to external SMS.

        When the linkage happens we need the Source, Target credential and the
        field name
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential input source.
        required: true
      tags:
      - credential-input-sources
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: No response body
      x-ai-description: Delete existing credential input source
  /credential-types/:
    get:
      operationId: credential_types_list
      description: List all credential types
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: Filter by credential type name.
      - in: query
        name: namespace
