      operationId: logs_purge_create
      description: 'Queue deletion of process logs using one UTC cutoff: before_date
        (YYYY-MM-DD) or retention_duration (positive ISO 8601). Alternatively, purge-all-logs=true
        deletes logs globally. It can be combined with before_date or retention_duration
        to delete only older logs, including prior audit markers and logs without
        a process. It leaves one new audit marker per affected process. Logs without
        a process cannot receive a marker. This mode cannot be combined with activation
        selectors or disabled audit. Without activation selectors, all processes,
        including orphaned ones, are included. Activation IDs and names limit cutoff
        deletion to their union. The returned job ID acknowledges scheduling only.'
      tags:
      - logs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogPurgeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogPurgeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogPurgeRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - EDAJWTAuthentication: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPurgeResponse'
          description: ''
        '400':
          description: The request contains invalid purge options.
        '403':
          description: Only superusers can queue a log purge.
        '500':
          description: The purge task could not be queued.
      x-ai-description: Create new logs purge
