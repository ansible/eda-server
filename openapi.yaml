          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        modified_by:
          type: integer
          readOnly: true
          nullable: true
          description: The user who last modified this resource.
        name:
          type: string
          readOnly: true
          description: The name of the feature flag. Must follow the format of FEATURE_<flag-name>_ENABLED.
        ui_name:
          type: string
          description: The pretty name to display in the application User Interface
          maxLength: 64
        condition:
          type: string
          readOnly: true
          default: boolean
          description: Used to specify a condition, which if met, will enable the
            feature flag.
