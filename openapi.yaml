    LogPurgeRequest:
      type: object
      description: Serializer for the asynchronous log purge endpoint.
      properties:
        before_date:
          type: string
          format: date
          description: Exclusive UTC midnight cutoff (YYYY-MM-DD).
        retention_duration:
          type: string
          description: Exclusive cutoff as a positive ISO 8601 duration.
        audit_trail:
          type: boolean
          default: true
          description: Write one audit marker per process that loses logs.
        activation_ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: Limit deletion to these activation IDs.
        activation_names:
          type: array
          items:
            type: string
          description: Limit deletion to these activation names.
        purge-all-logs:
          type: boolean
          default: false
          description: Delete all existing process logs globally. Can be combined
            with before_date or retention_duration to limit deletion to older logs.
            Cannot be combined with activation selectors or disabled audit.
    LogPurgeResponse:
      type: object
      description: Acknowledgement returned after a purge task is queued.
      properties:
        job_id:
          type: string
          format: uuid
      required:
      - job_id
