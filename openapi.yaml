components:
  schemas:
    ActivationCopy:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    ActivationCreate:
      type: object
      description: Serializer for creating the Activation.
      properties:
        name:
          type: string
        description:
          type: string
        is_enabled:
          type: boolean
        restart_on_project_update:
          type: boolean
          description: Auto-restart when rulebook changes after project sync
        decision_environment_id:
          type: integer
        rulebook_id:
          type: integer
        extra_var:
          type: string
          nullable: true
        organization_id:
          type: integer
        restart_policy:
          $ref: '#/components/schemas/RestartPolicyEnum'
        awx_token_id:
          type: integer
          nullable: true
        log_level:
          $ref: '#/components/schemas/LogLevelEnum'
        eda_credentials:
          type: array
          items:
            type: integer
        k8s_service_name:
          type: string
          nullable: true
        source_mappings:
          type: string
          description: Mapping between sources and event streams
        skip_audit_events:
          type: boolean
          description: Skip audit events for activation
        enable_persistence:
          type: boolean
          description: Enable persistence for activation
        rule_engine_credential_id:
          type: integer
          nullable: true
        k8s_pod_service_account_name:
          type: string
          nullable: true
        k8s_pod_labels: {}
        k8s_pod_annotations: {}
        k8s_pod_node_selector: {}
        k8s_pod_tolerations: {}
      required:
      - decision_environment_id
      - name
      - organization_id
      - rulebook_id
    ActivationInstance:
      type: object
      description: Serializer for the Activation Instance model.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        git_hash:
          type: string
        status_message:
          type: string
          nullable: true
        activation_id:
