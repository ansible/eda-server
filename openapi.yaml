    CleanTextFieldInfo:
      type: object
      description: Per-field metadata returned in OPTIONS actions. When ENHANCED_INPUT_VALIDATION_ENABLED
        is on, CharField/TextField entries on CleanTextMixin serializers may also
        include pattern hint keys. Tier-1 name fields may include normalize=NFC; tier-2
        fields do not.
      properties:
        type:
          type: string
        hidden:
          type: boolean
        label:
          type: string
        help_text:
          type: string
        filterable:
          type: boolean
        required:
          type: boolean
        max_length:
          type: integer
        default: {}
        pattern:
          type: string
          nullable: true
          description: Regex pattern (ECMAScript-compatible, no delimiters) that API
            clients can use for real-time client-side validation before submit. UX
            convenience only -- the server independently enforces validation, so clients
            must not treat this as a substitute for handling server-side errors. Omitted
            when ENHANCED_INPUT_VALIDATION_ENABLED is off, or when the field has no
            validation rule (non-text, excluded, or secret).
        patternDescription:
          type: string
          nullable: true
          description: Human-readable explanation of `pattern`, suitable for display
            next to the field. Present under the same condition as `pattern` -- the
            two always appear or are absent together.
        flags:
          type: string
          nullable: true
          description: Regex flags to apply when evaluating `pattern` (e.g. "u" for
            Unicode mode, "i" for case-insensitive). Present under the same condition
            as `pattern`.
        normalize:
          type: string
          nullable: true
          enum:
          - NFC
          description: Unicode normalization form to apply before evaluating `pattern`.
            Requires ENHANCED_INPUT_VALIDATION_ENABLED and a tier-1 "name" field --
            narrower than the other three keys, so it can be absent even when `pattern`
            is present. Not used on nested JSON field catalogs (credential inputs,
            etc.).
      required:
      - type
      - hidden
      - label
      additionalProperties: true
    CleanTextNestedStringField:
      type: object
      description: Dynamic credential-type input field catalog entry. When ENHANCED_INPUT_VALIDATION_ENABLED
        is on, non-secret string fields may include pattern, patternDescription, and
        flags (Tier 2; no normalize).
      properties:
        id:
          type: string
          description: Stable field identifier (used in inputs.required and credential
            payloads).
        label:
          type: string
          description: Human-readable field label.
        type:
          type: string
          description: Field type (e.g. string, boolean). Pattern hints apply to non-secret
            strings.
        help_text:
          type: string
        secret:
          type: boolean
          description: When true, pattern hints are omitted.
        default:
          description: Optional default value (string, boolean, etc.).
        multiline:
          type: boolean
        format:
          type: string
        ask_at_runtime:
          type: boolean
        pattern:
          type: string
          nullable: true
          description: Regex pattern (ECMAScript-compatible, no delimiters) that API
            clients can use for real-time client-side validation before submit. UX
            convenience only -- the server independently enforces validation, so clients
            must not treat this as a substitute for handling server-side errors. Omitted
            when ENHANCED_INPUT_VALIDATION_ENABLED is off, or when the field has no
            validation rule (non-text, excluded, or secret).
        patternDescription:
          type: string
          nullable: true
          description: Human-readable explanation of `pattern`, suitable for display
            next to the field. Present under the same condition as `pattern` -- the
            two always appear or are absent together.
        flags:
          type: string
          nullable: true
          description: Regex flags to apply when evaluating `pattern` (e.g. "u" for
            Unicode mode, "i" for case-insensitive). Present under the same condition
            as `pattern`.
      additionalProperties: true
    AuthenticatorPluginConfigurationField:
      type: object
      description: Authenticator plugin configuration field. When ENHANCED_INPUT_VALIDATION_ENABLED
        is on, non-secret CharField entries may include pattern, patternDescription,
        and flags (Tier 2; no normalize).
      properties:
        name:
          type: string
          description: Configuration field name.
        help_text:
          type: string
        required:
          type: boolean
        default: {}
        type:
          type: string
          description: DRF field class name (e.g. CharField).
        ui_field_label:
          type: string
        choices:
          type: object
          additionalProperties: {}
          description: Optional choice mapping (value -> label) when the field defines
            choices.
        pattern:
          type: string
          nullable: true
          description: Regex pattern (ECMAScript-compatible, no delimiters) that API
            clients can use for real-time client-side validation before submit. UX
            convenience only -- the server independently enforces validation, so clients
            must not treat this as a substitute for handling server-side errors. Omitted
            when ENHANCED_INPUT_VALIDATION_ENABLED is off, or when the field has no
            validation rule (non-text, excluded, or secret).
        patternDescription:
          type: string
          nullable: true
          description: Human-readable explanation of `pattern`, suitable for display
            next to the field. Present under the same condition as `pattern` -- the
            two always appear or are absent together.
        flags:
          type: string
          nullable: true
          description: Regex flags to apply when evaluating `pattern` (e.g. "u" for
            Unicode mode, "i" for case-insensitive). Present under the same condition
            as `pattern`.
      additionalProperties: true
  securitySchemes:
    EDAJWTAuthentication:
      type: apiKey
      name: X-DAB-JW-TOKEN
      in: header
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
servers:
- url: /api/eda/v1
