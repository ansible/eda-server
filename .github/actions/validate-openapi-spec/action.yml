name: validate-openapi-spec
description: Validate OpenAPI specification compliance
runs:
  using: composite
  steps:
    - name: Install poetry
      shell: bash
      run: pipx install poetry

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'poetry'

    - name: Install package
      shell: bash
      env:
        POETRY_INSTALLER_ONLY_BINARY: ":all:"
      run: poetry install -E all --only main

    - name: Install openapi-spec-validator
      shell: bash
      env:
        PIP_ONLY_BINARY: ":all:"
      run: pip install openapi-spec-validator==0.9.0

    - name: Generate OpenAPI specification and print report
      shell: bash
      run: poetry run python scripts/check_openapi_compliance.py --generate

    - name: Validate OpenAPI specification
      shell: bash
      run: openapi-spec-validator openapi.json
