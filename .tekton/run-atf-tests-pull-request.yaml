---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: eda-server-atf-tests-pull-request
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/{{repo_owner}}/{{repo_name}}?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/run-atf-tests$"
    pipelinesascode.tekton.dev/target-namespace: ansible-ci-tenant
  labels:
    appstudio.openshift.io/application: '{{repo_owner}}'
    appstudio.openshift.io/component: '{{repo_owner}}-{{repo_name}}'
    pipelines.appstudio.openshift.io/type: build
spec:
  timeouts:
    pipeline: "4h"
    tasks: "2h"
    finally: "1h"
  pipelineRef:
    resolver: git
    params:
      - name: org
        value: ansible-automation-platform
      - name: repo
        value: aap-konflux-pipelines
      - name: revision
        value: rywillia/AAP-94453
      - name: pathInRepo
        value: pipelines/test/aap-api-tests/0.1/development/pipeline.yaml
      - name: token
        value: github-aap-pde-ci-bot-credentials-ansible-automation-platform
      - name: tokenKey
        value: password
      - name: scmType
        value: github

  taskRunTemplate:
    serviceAccountName: konflux-integration-runner

  params:
    - name: git-url
      value: "{{source_url}}"
    - name: pipeline-github-org
      value: "{{repo_owner}}"
    - name: pipeline-github-repo
      value: "{{repo_name}}"
    - name: pipeline-github-target-branch
      value: '{{target_branch}}'
    - name: pipeline-github-pr-revision
      value: "{{revision}}"
    - name: pipeline-github-pr-number
      value: "{{pull_request_number}}"
    - name: aap-dev-component-source-name
      value: "eda"

    - name: git-resolver-org
      value: ansible-automation-platform
    - name: git-resolver-repo
      value: aap-konflux-pipelines
    - name: git-resolver-revision
      value: rywillia/AAP-94453
    - name: git-resolver-token-secret
      value: github-aap-pde-ci-bot-credentials-ansible-automation-platform
    - name: git-resolver-token-key
      value: password

  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
